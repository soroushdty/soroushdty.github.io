bio: "Physician and Biomedical Informatics Ph.D. researcher at Arizona State University advancing computational cardiology, health wearables, and digital health systems. Combines clinical training and frontline primary care experience with machine learning, wearable biosignals, and cardiovascular physiological modeling. Research centers on anchoring continuous wearable sensor streams and clinical data in cardiovascular mechanics and physiological rationale, with a focus on cardio-oncology and evidence-grounded health data interoperability. Bridges the gap between physiological modeling and real-world clinical practice."
